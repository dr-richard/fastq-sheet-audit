[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastq-sheet-audit"
dynamic = ["version"]
description = "Read-only preflight checks that reconcile sample sheets with FASTQ files on disk"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "dr-richard"}]
keywords = ["bioinformatics", "fastq", "samplesheet", "validation", "sequencing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fastq-sheet-audit = "fastq_sheet_audit.cli:main"

[project.gui-scripts]
fastq-sheet-audit-gui = "fastq_sheet_audit.gui:main"

[tool.setuptools.dynamic]
version = {attr = "fastq_sheet_audit.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fastq_sheet_audit.profile_data" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
