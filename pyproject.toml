[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastq-sheet-audit"
version = "0.1.0"
description = "Read-only preflight checks that reconcile sample sheets with FASTQ files on disk"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "dr-richard"}]
keywords = ["bioinformatics", "fastq", "samplesheet", "validation", "sequencing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fastq-sheet-audit = "fastq_sheet_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
